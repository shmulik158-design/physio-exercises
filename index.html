<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בונה דפי תרגילים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F6F1;
    --paper-raised:#FFFFFF;
    --ink:#1E2B29;
    --ink-soft:#5B6C69;
    --teal:#2B4C4A;
    --teal-dim:#7FA39E;
    --teal-dark:#1B302E;
    --line:#DAD9CE;
    --shoulder:#C9773F;
    --cervical:#7C8F6E;
    --thoracic:#8E7A9C;
    --lumbar:#B85C6B;
    --hip:#4D7C8A;
    --knee:#C9A227;
    --ankle:#5B8266;
    --wrist:#9B6B4A;

    --radius-sm:3px;
    --radius-md:4px;

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

    --text-2xs:10.5px; --text-xs:11.5px; --text-sm:13px;
    --text-base:15px; --text-md:16px; --text-lg:17.5px;
    --text-xl:21px; --text-2xl:27px; --text-3xl:32px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Assistant',sans-serif;
    font-size:var(--text-base);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif; margin:0; text-wrap:balance;}
  .mono{font-family:'Roboto Mono',monospace;}

  :focus-visible{outline:2px solid var(--teal-dim); outline-offset:2px; border-radius:2px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  /* ---------- App chrome ---------- */
  header.app-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:var(--sp-4) var(--sp-6);
    border-bottom:1px solid var(--line);
    background:var(--paper-raised);
  }
  .brand{display:flex; align-items:center; gap:var(--sp-3);}
  .brand .mark{flex:none;}
  header.app-bar h1{font-size:var(--text-2xl); color:var(--teal); font-weight:700;}
  header.app-bar .tag{
    font-family:'Roboto Mono',monospace; font-size:var(--text-2xs); color:var(--ink-soft);
    letter-spacing:.03em; border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:4px 10px; font-variant-numeric:tabular-nums;
  }

  .layout{
    display:grid;
    grid-template-columns:1fr 400px;
    gap:0;
    min-height:calc(100vh - 66px);
  }
  @media (max-width: 900px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---------- Library (left) ---------- */
  .library{padding:var(--sp-5) var(--sp-6);}
  .filters{
    display:flex; gap:var(--sp-3); flex-wrap:wrap; margin-bottom:var(--sp-2);
  }
  .search-wrap{position:relative; flex:1; min-width:200px;}
  .search-wrap .search-icon{
    position:absolute; inset-inline-start:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--ink-soft); pointer-events:none;
  }
  .filters input, .filters select{
    font-family:'Assistant',sans-serif; font-size:var(--text-sm);
    padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius-md);
    background:var(--paper-raised); color:var(--ink);
    transition:border-color .15s ease;
  }
  .filters input{width:100%; padding-inline-start:34px;}
  .filters input:hover, .filters select:hover{border-color:var(--teal-dim);}
  .filters input:focus, .filters select:focus{border-color:var(--teal); outline:none;}

  .result-count{
    font-family:'Roboto Mono',monospace; font-size:var(--text-2xs); color:var(--ink-soft);
    margin-bottom:var(--sp-3); font-variant-numeric:tabular-nums; min-height:1.2em;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:var(--sp-4);
  }
  .grid-empty{
    grid-column:1/-1; text-align:center; color:var(--ink-soft); font-size:var(--text-sm);
    border:1px dashed var(--line); border-radius:var(--radius-md);
    padding:var(--sp-7) var(--sp-4);
  }
  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:var(--sp-4);
    position:relative;
    border-inline-start:4px solid var(--region-color, var(--teal));
    display:flex; flex-direction:column; gap:var(--sp-2);
    transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  .card:hover{
    box-shadow:0 4px 16px rgba(30,43,41,.08);
    transform:translateY(-1px);
  }
  .card .thumb{
    width:100%; aspect-ratio:1/1; background:#fff;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .card .thumb img{width:100%; height:100%; object-fit:contain;}
  .card .thumb svg{width:70%; height:70%;}
  .card .meta{display:flex; flex-direction:column; gap:2px;}
  .card .name{font-weight:600; font-size:var(--text-lg);}
  .card .region-label{
    font-size:var(--text-xs); color:var(--region-color, var(--ink-soft));
    font-family:'Roboto Mono',monospace; text-transform:uppercase; letter-spacing:.05em;
  }
  .card button.add{
    margin-top:auto;
    background:var(--teal); color:#fff; border:none;
    padding:8px 10px; border-radius:var(--radius-sm); font-size:var(--text-sm); cursor:pointer;
    font-family:'Assistant',sans-serif; font-weight:600;
    transition:background .15s ease, transform .1s ease;
  }
  .card button.add:hover{background:var(--teal-dark);}
  .card button.add:active{transform:translateY(1px);}
  .card button.add:disabled{background:var(--line); color:var(--ink-soft); cursor:default; transform:none;}

  /* ---------- Sheet builder (right) ---------- */
  .builder{
    background:var(--paper-raised);
    border-inline-start:1px solid var(--line);
    padding:var(--sp-5) var(--sp-5) var(--sp-7);
    display:flex; flex-direction:column; gap:var(--sp-4);
  }
  .builder h2{font-size:var(--text-xl); color:var(--teal);}
  .builder .patient-field{
    font-size:var(--text-sm); color:var(--ink-soft);
  }
  .builder .patient-field input{
    width:100%; margin-top:6px; padding:9px 11px; font-size:var(--text-base);
    border:1px solid var(--line); border-radius:var(--radius-md); font-family:'Assistant',sans-serif;
    color:var(--ink); transition:border-color .15s ease;
  }
  .builder .patient-field input:focus{border-color:var(--teal); outline:none;}

  .sheet-list{display:flex; flex-direction:column; gap:var(--sp-3);}
  .sheet-empty{
    color:var(--ink-soft); font-size:var(--text-sm); border:1px dashed var(--line);
    border-radius:var(--radius-md); padding:var(--sp-6) var(--sp-4); text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:var(--sp-3);
  }
  .sheet-empty svg{width:30px; height:30px; color:var(--teal-dim);}

  .sheet-item{
    border:1px solid var(--line); border-radius:var(--radius-md); padding:var(--sp-3);
    border-inline-start:3px solid var(--region-color, var(--teal));
    display:flex; flex-direction:column; gap:var(--sp-3);
  }
  .sheet-item-head{display:flex; align-items:center; gap:var(--sp-3);}
  .sheet-item .thumb-sm{
    width:42px; height:42px; flex:none; background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;
  }
  .sheet-item .thumb-sm svg{width:75%; height:75%;}
  .sheet-item .info{flex:1; min-width:0;}
  .sheet-item .info .name{font-size:var(--text-base); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sheet-item .info .region-label{
    font-size:var(--text-2xs); color:var(--region-color, var(--ink-soft));
    font-family:'Roboto Mono',monospace; text-transform:uppercase; letter-spacing:.05em;
  }
  .sheet-item .row-actions{display:flex; gap:2px; flex:none; margin-inline-start:auto;}

  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border:none; border-radius:var(--radius-sm);
    background:none; color:var(--ink-soft); cursor:pointer; padding:0;
    transition:background .15s ease, color .15s ease;
  }
  .icon-btn svg{width:14px; height:14px;}
  .icon-btn:hover{background:var(--paper); color:var(--ink);}
  .icon-btn:disabled{opacity:.35; cursor:default;}
  .icon-btn:disabled:hover{background:none;}
  .icon-btn.danger:hover{background:#F7EBEC; color:var(--lumbar);}

  .dosage{
    display:grid; gap:var(--sp-2);
    grid-template-columns:76px 1fr;
    grid-template-areas:"sets reps" "intensity intensity";
  }
  .dosage .field{display:flex; flex-direction:column; gap:3px;}
  .dosage .field.field-sets{grid-area:sets;}
  .dosage .field.field-reps{grid-area:reps;}
  .dosage .field.field-intensity{grid-area:intensity;}
  .dosage .field label{
    font-family:'Roboto Mono',monospace; font-size:var(--text-2xs); color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.04em;
  }
  .dosage .field label .hint{text-transform:none; letter-spacing:0; font-family:'Assistant',sans-serif;}
  .dosage .field input{
    border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:6px 8px; font-family:'Roboto Mono',monospace; font-size:var(--text-sm);
    color:var(--ink); width:100%; transition:border-color .15s ease;
  }
  .dosage .field.field-intensity input{font-family:'Assistant',sans-serif;}
  .dosage .field input:focus{border-color:var(--teal); outline:none;}

  .instr-edit{border-top:1px solid var(--line); padding-top:var(--sp-2);}
  .instr-edit summary{
    display:flex; align-items:center; gap:6px; cursor:pointer; list-style:none;
    font-family:'Roboto Mono',monospace; font-size:var(--text-2xs); color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.04em; transition:color .15s ease;
  }
  .instr-edit summary::-webkit-details-marker{display:none;}
  .instr-edit summary:hover{color:var(--ink);}
  .instr-edit summary .chevron{width:11px; height:11px; flex:none; transition:transform .15s ease;}
  .instr-edit[open] summary .chevron{transform:rotate(90deg);}
  .instr-edit summary .edited-dot{color:var(--teal-dim); font-size:8px; margin-inline-start:1px;}
  .instr-edit textarea{
    width:100%; margin-top:var(--sp-2); padding:8px 10px; font-family:'Assistant',sans-serif;
    font-size:var(--text-sm); line-height:1.5; color:var(--ink);
    border:1px solid var(--line); border-radius:var(--radius-sm); resize:vertical;
  }
  .instr-edit textarea:focus{border-color:var(--teal); outline:none;}
  .instr-edit .reset-instructions{
    display:block; margin-top:6px; background:none; border:none; padding:0; cursor:pointer;
    font-family:'Assistant',sans-serif; font-size:var(--text-2xs); color:var(--teal-dim);
    text-decoration:underline; text-underline-offset:2px; transition:color .15s ease;
  }
  .instr-edit .reset-instructions:hover{color:var(--teal);}

  .print-btn{
    position:sticky; bottom:0;
    background:var(--teal); color:#fff; border:none;
    padding:13px; border-radius:var(--radius-md); font-size:var(--text-base); font-weight:700;
    cursor:pointer; font-family:'Assistant',sans-serif;
    display:flex; align-items:center; justify-content:center; gap:var(--sp-2);
    transition:background .15s ease, transform .1s ease;
  }
  .print-btn:disabled{background:var(--line); color:var(--ink-soft); cursor:default;}
  .print-btn:not(:disabled):hover{background:var(--teal-dark);}
  .print-btn:not(:disabled):active{transform:translateY(1px);}

  /* ---------- Print sheet (hidden on screen) ---------- */
  #print-sheet{display:none;}

  @media print{
    header.app-bar, .layout, .library, .builder{display:none !important;}
    #print-sheet{display:block; padding:0;}
    body{background:#fff; font-size:13px;}

    .p-header{
      display:flex; justify-content:space-between; align-items:flex-end;
      border-bottom:2px solid var(--teal); padding-bottom:14px; margin-bottom:28px;
    }
    .p-header h1{font-size:30px; color:var(--ink);}
    .p-meta{text-align:end; display:flex; flex-direction:column; gap:3px;}
    .p-patient{font-family:'Roboto Mono',monospace; font-size:13px; font-weight:500; color:var(--ink);}
    .p-date{font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-soft);}

    .p-exercise{
      break-inside:avoid;
      display:grid; grid-template-columns:32px 120px 1fr; gap:16px; align-items:start;
      border-bottom:1px solid rgba(30,43,41,.14); padding:18px 0;
    }
    .p-exercise:first-of-type{padding-top:0;}
    .p-num{
      font-family:'Frank Ruhl Libre',serif; font-size:22px; color:var(--teal-dim);
      font-variant-numeric:tabular-nums; line-height:1.1;
    }
    .p-exercise .p-thumb{
      width:120px; height:120px; overflow:hidden; border:1px solid rgba(30,43,41,.12);
      border-radius:3px;
    }
    .p-exercise .p-thumb img, .p-exercise .p-thumb svg{width:100%; height:100%; object-fit:contain;}
    .p-exercise h3{font-size:16.5px; margin-bottom:3px;}
    .p-exercise .p-region{
      font-family:'Roboto Mono',monospace; font-size:10px; text-transform:uppercase;
      letter-spacing:.05em; color:var(--region-color, var(--ink-soft)); margin-bottom:8px;
    }
    .p-exercise .p-dose{
      font-family:'Roboto Mono',monospace; font-size:13px; font-weight:500; color:var(--teal);
      font-variant-numeric:tabular-nums; margin-bottom:8px;
    }
    .p-exercise .p-instructions{font-size:12.5px; color:#333; line-height:1.6; max-width:62ch;}
    .p-footer{
      margin-top:28px; padding-top:12px; border-top:1px solid rgba(30,43,41,.14);
      display:flex; justify-content:space-between;
      font-family:'Roboto Mono',monospace; font-size:10px; color:var(--ink-soft);
    }
  }
</style>
</head>
<body>

<header class="app-bar">
  <div class="brand">
    <svg class="mark" width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round">
      <path d="M6 24 A14 14 0 0 1 26 24"/>
      <line x1="16" y1="24" x2="16" y2="9"/>
      <line x1="16" y1="24" x2="25.5" y2="15"/>
      <circle cx="16" cy="24" r="1.7" fill="var(--teal)" stroke="none"/>
    </svg>
    <h1>בונה דפי תרגילים</h1>
  </div>
  <span class="tag" id="libCount"></span>
</header>

<div class="layout">

  <!-- LIBRARY -->
  <section class="library">
    <div class="filters">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="4.5"/>
          <line x1="10.5" y1="10.5" x2="14" y2="14"/>
        </svg>
        <input id="search" type="text" placeholder="חיפוש תרגיל...">
      </div>
      <select id="regionFilter">
        <option value="">כל האזורים</option>
      </select>
    </div>
    <div class="result-count" id="resultCount"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- BUILDER -->
  <aside class="builder">
    <h2>הדף הנוכחי</h2>
    <label class="patient-field">
      שם המטופל (לא נשמר, מוצג רק על הדף)
      <input id="patientName" type="text" placeholder="לא חובה">
    </label>
    <div class="sheet-list" id="sheetList">
      <div class="sheet-empty">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="7" y="5" width="18" height="24" rx="1.5"/>
          <rect x="12" y="3" width="8" height="4" rx="1"/>
          <line x1="11" y1="13" x2="21" y2="13"/>
          <line x1="11" y1="18" x2="21" y2="18"/>
          <line x1="11" y1="23" x2="17" y2="23"/>
        </svg>
        <span>עדיין לא נבחרו תרגילים</span>
      </div>
    </div>
    <button class="print-btn" id="printBtn" disabled>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <path d="M5 8V3h10v5M5 8H3.5A1.5 1.5 0 0 0 2 9.5v4A1.5 1.5 0 0 0 3.5 15H5m10-7h1.5A1.5 1.5 0 0 1 18 9.5v4a1.5 1.5 0 0 1-1.5 1.5H15m-10 0v3h10v-3m-10 0h10"/>
      </svg>
      <span>הפק דף להדפסה</span>
    </button>
  </aside>

</div>

<!-- PRINT-ONLY SHEET -->
<div id="print-sheet">
  <div class="p-header">
    <h1>תוכנית תרגילים</h1>
    <div class="p-meta">
      <div class="p-patient" id="pPatient"></div>
      <div class="p-date" id="pDate"></div>
    </div>
  </div>
  <div id="pExercises"></div>
  <div class="p-footer">
    <span id="pFooterCount"></span>
    <span>בונה דפי תרגילים</span>
  </div>
</div>

<script>
/* ============================================================
   DATA LAYER — loads ./exercises.json, images referenced as
   ./images/${image_file}.

   NOTE ON DOSAGE FIELDS: default_sets / default_reps /
   default_intensity_he are free text on purpose (e.g. "6-10",
   "עד RIR 3-4") — not numbers. When irritability-based dosage
   presets are added later, they'll live in a new
   `dosage_by_irritability` object per exercise, and a global
   irritability toggle will just swap which preset feeds these
   same three fields. No schema change needed here for that.
   ============================================================ */

const REGION_LABELS = {
  shoulder:"כתף", cervical:"צוואר", thoracic:"גב עליון",
  lumbar:"גב תחתון", hip:"ירך", knee:"ברך", ankle:"קרסול", wrist:"שורש כף יד"
};

// Placeholder line-figure icons per region, shown when an exercise image fails to load.
function placeholderSVG(region){
  const icons = {
    shoulder:`<circle cx="50" cy="20" r="8"/><line x1="50" y1="28" x2="50" y2="60"/><line x1="50" y1="35" x2="25" y2="20"/><line x1="50" y1="35" x2="75" y2="50"/><line x1="50" y1="60" x2="35" y2="90"/><line x1="50" y1="60" x2="65" y2="90"/>`,
    cervical:`<circle cx="50" cy="22" r="8"/><line x1="50" y1="30" x2="50" y2="65"/><line x1="50" y1="38" x2="30" y2="55"/><line x1="50" y1="38" x2="70" y2="55"/><line x1="50" y1="65" x2="38" y2="92"/><line x1="50" y1="65" x2="62" y2="92"/>`,
    thoracic:`<circle cx="50" cy="18" r="8"/><line x1="50" y1="26" x2="50" y2="62"/><line x1="50" y1="34" x2="28" y2="45"/><line x1="50" y1="34" x2="72" y2="45"/><line x1="50" y1="62" x2="36" y2="90"/><line x1="50" y1="62" x2="64" y2="90"/>`,
    lumbar:`<circle cx="50" cy="18" r="8"/><path d="M50 26 Q60 45 50 62"/><line x1="50" y1="34" x2="30" y2="42"/><line x1="50" y1="34" x2="70" y2="42"/><line x1="50" y1="62" x2="38" y2="90"/><line x1="50" y1="62" x2="62" y2="90"/>`,
    hip:`<circle cx="50" cy="16" r="8"/><line x1="50" y1="24" x2="50" y2="55"/><line x1="50" y1="30" x2="32" y2="42"/><line x1="50" y1="30" x2="68" y2="42"/><line x1="50" y1="55" x2="30" y2="70"/><line x1="30" y1="70" x2="30" y2="92"/><line x1="50" y1="55" x2="62" y2="92"/>`,
    knee:`<circle cx="50" cy="14" r="8"/><line x1="50" y1="22" x2="50" y2="50"/><line x1="50" y1="28" x2="34" y2="38"/><line x1="50" y1="28" x2="66" y2="38"/><line x1="50" y1="50" x2="42" y2="70"/><line x1="42" y1="70" x2="55" y2="92"/><line x1="50" y1="50" x2="58" y2="72"/><line x1="58" y1="72" x2="58" y2="92"/>`,
    ankle:`<circle cx="50" cy="14" r="8"/><line x1="50" y1="22" x2="50" y2="55"/><line x1="50" y1="28" x2="35" y2="40"/><line x1="50" y1="28" x2="65" y2="40"/><line x1="50" y1="55" x2="42" y2="85"/><line x1="42" y1="85" x2="58" y2="90"/><line x1="50" y1="55" x2="60" y2="85"/>`,
    wrist:`<circle cx="50" cy="18" r="8"/><line x1="50" y1="26" x2="50" y2="60"/><line x1="50" y1="32" x2="28" y2="48"/><line x1="28" y1="48" x2="20" y2="46"/><line x1="50" y1="32" x2="72" y2="48"/><line x1="50" y1="60" x2="38" y2="90"/><line x1="50" y1="60" x2="62" y2="90"/>`
  };
  return `<svg viewBox="0 0 100 100" fill="none" stroke="#1E2B29" stroke-width="3.2" stroke-linecap="round">${icons[region]||icons.shoulder}</svg>`;
}

function handleImgError(imgEl, region){
  const wrapper = document.createElement('div');
  wrapper.innerHTML = placeholderSVG(region);
  imgEl.replaceWith(wrapper.firstElementChild);
}

// "TODO" is a content-authoring placeholder meaning "no instructions written yet" — never show it to the therapist.
function resolveDefaultInstructions(ex){
  return ex.instructions_he === 'TODO' ? '' : ex.instructions_he;
}

let EXERCISES = [];

fetch('./exercises.json')
  .then(r => r.json())
  .then(data => {
    EXERCISES = data.map(ex => ({
      ...ex,
      default_sets: String(ex.default_sets || ""),
      default_reps: String(ex.default_reps || ""),
      default_intensity_he: ex.default_intensity_he || ""
    }));
    init();
  })
  .catch(err => {
    console.error("Failed to load exercises.json:", err);
    document.getElementById('grid').innerHTML = `
      <div style="grid-column: 1/-1; padding: 20px; color: #c33; font-size: 14px;">
        <strong>שגיאה:</strong> לא הצליח לטעון את exercises.json.<br>
        ודא שהקובץ נמצא באותה תיקייה כמו index.html
      </div>
    `;
  });
let sheet = []; // { ex, sets, reps, intensity, instructions }

let initialized = false;

function init(){
  populateRegionFilter();
  renderGrid();
  document.getElementById('libCount').textContent = `${EXERCISES.length} תרגילים במאגר`;
  if (!initialized){
    document.getElementById('search').addEventListener('input', renderGrid);
    document.getElementById('regionFilter').addEventListener('change', renderGrid);
    document.getElementById('printBtn').addEventListener('click', ()=>{ buildPrintSheet(); window.print(); });
    initialized = true;
  }
}

function renderGrid(){
  const q = document.getElementById('search').value.trim();
  const region = document.getElementById('regionFilter').value;
  const grid = document.getElementById('grid');
  const list = EXERCISES.filter(ex => (!region || ex.region===region) && (!q || ex.name_he.includes(q)));

  document.getElementById('resultCount').textContent = list.length ? `${list.length} תרגילים` : '';

  grid.innerHTML = '';
  if (list.length === 0){
    grid.innerHTML = `<div class="grid-empty">לא נמצאו תרגילים התואמים לחיפוש</div>`;
    return;
  }

  list.forEach(ex=>{
      const inSheet = sheet.some(s=>s.ex.id===ex.id);
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--region-color', `var(--${ex.region})`);
      card.innerHTML = `
        <div class="thumb"><img src="./images/${ex.image_file}" loading="lazy" decoding="async" onerror="handleImgError(this, '${ex.region}')" alt="${ex.name_he}"></div>
        <div class="meta">
          <div class="name">${ex.name_he}</div>
          <div class="region-label">${REGION_LABELS[ex.region]}</div>
        </div>
        <button class="add" ${inSheet?'disabled':''}>${inSheet?'נוסף ✓':'הוסף לדף'}</button>
      `;
      card.querySelector('button.add').addEventListener('click', ()=> addToSheet(ex));
      grid.appendChild(card);
    });
}

function addToSheet(ex){
  if (sheet.some(s=>s.ex.id===ex.id)) return;
  sheet.push({
    ex, sets: ex.default_sets, reps: ex.default_reps,
    intensity: ex.default_intensity_he || "",
    instructions: resolveDefaultInstructions(ex)
  });
  renderSheet();
  renderGrid();
}

function removeFromSheet(id){
  sheet = sheet.filter(s=>s.ex.id!==id);
  renderSheet();
  renderGrid();
}

function moveInSheet(id, dir){
  const i = sheet.findIndex(s=>s.ex.id===id);
  const j = i+dir;
  if (j<0 || j>=sheet.length) return;
  [sheet[i], sheet[j]] = [sheet[j], sheet[i]];
  renderSheet();
}

function renderSheet(){
  const list = document.getElementById('sheetList');
  const printBtn = document.getElementById('printBtn');
  if (sheet.length===0){
    list.innerHTML = `
      <div class="sheet-empty">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="7" y="5" width="18" height="24" rx="1.5"/>
          <rect x="12" y="3" width="8" height="4" rx="1"/>
          <line x1="11" y1="13" x2="21" y2="13"/>
          <line x1="11" y1="18" x2="21" y2="18"/>
          <line x1="11" y1="23" x2="17" y2="23"/>
        </svg>
        <span>עדיין לא נבחרו תרגילים</span>
      </div>`;
    printBtn.disabled = true;
    return;
  }
  printBtn.disabled = false;
  list.innerHTML = '';
  sheet.forEach((s, idx)=>{
    const row = document.createElement('div');
    row.className = 'sheet-item';
    row.style.setProperty('--region-color', `var(--${s.ex.region})`);
    row.innerHTML = `
      <div class="sheet-item-head">
        <div class="thumb-sm">${placeholderSVG(s.ex.region)}</div>
        <div class="info">
          <div class="name">${s.ex.name_he}</div>
          <div class="region-label">${REGION_LABELS[s.ex.region]}</div>
        </div>
        <div class="row-actions">
          <button class="icon-btn up" title="הזז למעלה" aria-label="הזז תרגיל למעלה" ${idx===0?'disabled':''}>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M4 10l4-4 4 4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn down" title="הזז למטה" aria-label="הזז תרגיל למטה" ${idx===sheet.length-1?'disabled':''}>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M4 6l4 4 4-4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn danger del" title="הסר" aria-label="הסר תרגיל מהדף">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M4 4l8 8M12 4l-8 8" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="dosage">
        <div class="field field-sets">
          <label>סטים</label>
          <input type="text" class="sets-input" value="${s.sets}">
        </div>
        <div class="field field-reps">
          <label>חזרות / זמן</label>
          <input type="text" class="reps-input" value="${s.reps}">
        </div>
        <div class="field field-intensity">
          <label>הערות מטפל <span class="hint">— לא חובה</span></label>
          <input type="text" class="intensity-input" value="${s.intensity}">
        </div>
      </div>
      <details class="instr-edit">
        <summary>
          <svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
          <span>עריכת הנחיית ביצוע</span>
          <span class="edited-dot" title="ההנחיה נערכה" ${s.instructions===resolveDefaultInstructions(s.ex)?'style="display:none;"':''}>●</span>
        </summary>
        <textarea class="instructions-input" rows="4">${s.instructions}</textarea>
        <button type="button" class="reset-instructions">אפס לברירת מחדל</button>
      </details>
    `;
    row.querySelector('.sets-input').addEventListener('input', e=> s.sets = e.target.value);
    row.querySelector('.reps-input').addEventListener('input', e=> s.reps = e.target.value);
    row.querySelector('.intensity-input').addEventListener('input', e=> s.intensity = e.target.value);
    row.querySelector('.up').addEventListener('click', ()=> moveInSheet(s.ex.id, -1));
    row.querySelector('.down').addEventListener('click', ()=> moveInSheet(s.ex.id, 1));
    row.querySelector('.del').addEventListener('click', ()=> removeFromSheet(s.ex.id));
    const instrTextarea = row.querySelector('.instructions-input');
    const editedDot = row.querySelector('.edited-dot');
    instrTextarea.addEventListener('input', e=>{
      s.instructions = e.target.value;
      editedDot.style.display = (s.instructions === resolveDefaultInstructions(s.ex)) ? 'none' : '';
    });
    row.querySelector('.reset-instructions').addEventListener('click', ()=>{
      s.instructions = resolveDefaultInstructions(s.ex);
      instrTextarea.value = s.instructions;
      editedDot.style.display = 'none';
    });
    list.appendChild(row);
  });
}

function populateRegionFilter(){
  const regionSelect = document.getElementById('regionFilter');
  regionSelect.querySelectorAll('option:not([value=""])').forEach(o => o.remove());
  Object.keys(REGION_LABELS).forEach(r=>{
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = REGION_LABELS[r];
    regionSelect.appendChild(opt);
  });
}

function buildPrintSheet(){
  const name = document.getElementById('patientName').value.trim();
  document.getElementById('pPatient').textContent = name ? `שם: ${name}` : '';
  document.getElementById('pDate').textContent =
    new Date().toLocaleDateString('he-IL', { year:'numeric', month:'long', day:'numeric' });
  document.getElementById('pFooterCount').textContent = `${sheet.length} תרגילים`;

  const container = document.getElementById('pExercises');
  container.innerHTML = '';
  sheet.forEach((s, idx)=>{
    const div = document.createElement('div');
    div.className = 'p-exercise';
    div.style.setProperty('--region-color', `var(--${s.ex.region})`);
    div.innerHTML = `
      <div class="p-num">${idx+1}</div>
      <div class="p-thumb"><img src="./images/${s.ex.image_file}" alt="${s.ex.name_he}"></div>
      <div>
        <h3>${s.ex.name_he}</h3>
        <div class="p-region">${REGION_LABELS[s.ex.region]}</div>
        <div class="p-dose">${s.sets} סטים × ${s.reps}${s.intensity ? ' — ' + s.intensity : ''}</div>
        <div class="p-instructions">${s.instructions}</div>
      </div>
    `;
    container.appendChild(div);
  });
}

init();
</script>
</body>
</html>
